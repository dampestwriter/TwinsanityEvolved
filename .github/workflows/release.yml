# .github/workflows/release.yml -- TwinsanityEvolved release artifacts: on a version tag (or by hand), one zip per
# platform -- macOS arm64, macOS x86_64, Linux x86_64, Linux aarch64, Windows x64 -- built by the same scripts a
# developer runs locally:
#
#   tools/ci/release_dist.sh          macOS / Linux: pinned wasm32 toolchain (tools/fetch_toolchain.sh), the engine's
#                                     static LGPL FFmpeg + static SDL2 (TE_DIST), configure + build, stage
#                                     dist/<platform>/, asset scan, zip + sha256
#   tools/ci/release_dist.ps1         Windows: clang-cl + Ninja through the engine's clang-cl shim, SDL2 + FFmpeg from
#                                     the vcpkg manifest (vcpkg.json), the same staging
#   tools/ci/linux.Dockerfile         the Linux lane's toolchain image for an offline reproduction:
#                                     docker build -f tools/ci/linux.Dockerfile -t te-linux . && \
#                                     docker run --rm -v "$PWD:/src" te-linux tools/ci/release_dist.sh --jobs 3
#
# Every artifact is the port's code + the engine + the decompilation compiled: NO game data (tools/ci/asset_scan.py
# over every staged folder; the user supplies their own disc image at run time). The engine (engine/) and the
# decompilation (game/) are vendored trees in this repository
# so a plain checkout holds everything the build needs.
#
# Windows builds through the preset (vcpkg at the manifest's builtin-baseline); its unit tests run on Mesa's llvmpipe
# because the runner has no GPU. The release job attaches the zips it finds and names any missing platform.
#
# Local validation: `actionlint .github/workflows/release.yml`; the scripts: `bash -n tools/ci/release_dist.sh`.
name: TwinsanityEvolved release

on:
  push:
    tags: ['v*']   # the game zips join the launcher's GitHub release (launcher.yml) on the same tag
  workflow_dispatch:

permissions:
  contents: write

env:
  TE_MIN_FREE_GB: 3

jobs:
  guard:
    name: asset scan (tree) + script syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Asset scan over the tree (zero findings)
        run: python3 tools/ci/asset_scan.py
      - name: Script syntax
        run: |
          bash -n tools/ci/release_dist.sh tools/ci/build_all.sh tools/ci/judges.sh tools/fetch_toolchain.sh tools/ci/asset_scan.sh
          python3 -m py_compile tools/oracle/diff.py tools/judges/hub_fps_judge.py tools/ci/asset_scan.py

  build:
    name: ${{ matrix.target }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: macos-arm64,   platform: macos,   jobs: 3 }
          - { os: macos-15-intel,   target: macos-x86_64,  platform: macos,   jobs: 3 }
          - { os: ubuntu-24.04,     target: linux-x86_64,  platform: linux,   jobs: 3 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, platform: linux,   jobs: 3 }
          - { os: windows-2022,     target: windows-x64,   platform: windows, jobs: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      MESA_VERSION: 26.2.3
      MESA_SHA256: 3f3613adb43cfd0f2e665ce2400b130c275f0b3317cb3a05566320a3a67589ed
    steps:
      - uses: actions/checkout@v4

      # --- dependencies per host --------------------------------------------------------------
      - name: Dependencies (macOS -- Homebrew; FFmpeg and SDL2 are built statically by the script)
        if: matrix.platform == 'macos'
        run: brew install cmake ninja nasm pkg-config

      - name: Dependencies (Linux -- the engine's package list + the toolchain fetch)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2046
          sudo apt-get install -y --no-install-recommends $(grep -v '^#' engine/tools/ci/linux_packages.txt | xargs) curl unzip nasm
      - name: Toolchain cache (wasi-sdk, wabt, libclang -- pinned tarballs)
        if: matrix.platform != 'windows'
        uses: actions/cache@v4
        with:
          path: |
            tools/toolchain/*.tar.gz
            tools/toolchain/*.tar.xz
            tools/toolchain/*.whl
          key: te-toolchain-${{ matrix.target }}-${{ hashFiles('tools/toolchain/PINS.sha256') }}

      - name: Dependencies (Windows -- Python for the shim)
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: vcpkg at the manifest's builtin-baseline
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          git -C "${{ github.workspace }}/vcpkg" checkout --quiet $baseline
          & "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: vcpkg binary cache (restore)
        if: matrix.platform == 'windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: MSVC developer environment (clang-cl, Ninja, the Windows SDK on PATH)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --- build + stage through the scripts --------------------------------------------------
      - name: release_dist.sh (toolchain, static deps, build, stage, scan, zip)
        if: matrix.platform != 'windows'
        shell: bash
        run: tools/ci/release_dist.sh --jobs ${{ matrix.jobs }} 2>&1 | tee release_dist.log

      # Windows: configure + build through the preset (VCPKG_ROOT on the step: the developer environment exports its
      # own), the unit tests on Mesa's llvmpipe, then the same staging as the other platforms
      - name: Windows -- toolchain, configure, build
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          ./tools/fetch_toolchain.ps1
          cmake --preset windows-clang-cl-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-clang-cl-release -j ${{ matrix.jobs }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows -- unit tests on Mesa llvmpipe
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $archive = "mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -UseBasicParsing "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/$archive" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:MESA_SHA256) { throw "mesa: sha256 mismatch" }
          7z x -y -omesa $archive x64/opengl32.dll x64/libgallium_wgl.dll | Out-Null
          $dirs = Get-ChildItem build-windows-release -Recurse -Filter *.exe | Where-Object { $_.Name -match '^(te_|test_)' } | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          foreach ($d in $dirs) { Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll $d }
          ctest --preset windows-clang-cl-release -j ${{ matrix.jobs }}
          $rc = $LASTEXITCODE
          foreach ($d in $dirs) { Remove-Item "$d/opengl32.dll", "$d/libgallium_wgl.dll" -ErrorAction SilentlyContinue }
          if ($rc -ne 0) { exit $rc }
      - name: Windows -- stage, scan, zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./tools/ci/release_dist.ps1 -SkipBuild -BuildDir "$PWD/build-windows-release" 2>&1 | Tee-Object -FilePath release_dist.log
      - name: vcpkg binary cache (save)
        if: matrix.platform == 'windows' && always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Asset scan over the staged folder (again, on the runner)
        if: matrix.platform != 'windows'
        shell: bash
        run: python3 tools/ci/asset_scan.py dist/${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: twinsanityevolved-${{ matrix.target }}
          path: |
            dist/twinsanityevolved-${{ matrix.target }}.zip
            dist/twinsanityevolved-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.target }}
          path: release_dist.log
          if-no-files-found: ignore

  release:
    name: SHA256SUMS + GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twinsanityevolved-*
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS over the zips; the notes name every platform, present or missing
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          expected="macos-arm64 macos-x86_64 linux-x86_64 linux-aarch64 windows-x64"
          missing=""
          for t in $expected; do
            z="artifacts/twinsanityevolved-$t.zip"
            if [ -f "$z" ]; then mv "$z" "release/twinsanityevolved-${tag}-$t.zip"; else missing="$missing $t"; fi
          done
          (cd release && sha256sum ./*.zip > SHA256SUMS && cat SHA256SUMS)
          # The release's notes (the launcher workflow only adds its files to the same release)
          cat > release/NOTES.md <<EOF
          Crash Twinsanity as a native PC game: the [twinsanity-reversed](https://github.com/Smartkin/twinsanity-reversed)
          decompilation running on the NativeEE engine. **This release contains no game data:
          you play with your own PAL disc image (SLES-52568).**

          ### Play

          1. Download the zip for your system:

             | System | Download |
             |---|---|
             | Windows 10 / 11 (64-bit) | \`twinsanityevolved-${tag}-windows-x64.zip\` |
             | macOS, Apple silicon | \`twinsanityevolved-${tag}-macos-arm64.zip\` |
             | macOS, Intel | \`twinsanityevolved-${tag}-macos-x86_64.zip\` |
             | Linux x86_64 / ARM64 | \`twinsanityevolved-${tag}-linux-x86_64.zip\` / \`-linux-aarch64.zip\` |

          2. Unzip it anywhere, on any drive (Windows: right-click the zip > *Properties* > tick **Unblock** first, so
             SmartScreen does not warn about the unsigned program).
          3. Run \`twinsanityevolved\` (\`twinsanityevolved.exe\` on Windows; on macOS the first time right-click it >
             **Open**). The first time it asks for your disc image: choose your PAL Crash Twinsanity \`.iso\`.

          Nothing is installed and nothing else is downloaded. The game remembers your disc in \`disc-image.txt\` and keeps its
          memory cards and settings in \`userdata\` inside its own folder; deleting the folder removes everything. The zips
          hold only the program, its libraries and the licences: every one passes the repository's asset scan, which fails
          on any disc file or game asset.

          **50 Hz (the PAL speed):** Options > graphic options > **game rate** > **50 hz (pal)**, from the next start
          (or \`game.hz = 50\` in \`userdata/ps2r.ini\`). The default is 60.

          ### Requirements

          - A graphics driver with OpenGL 4.1 (any current NVIDIA, AMD, Intel or Apple GPU).
          - Keyboard and mouse, or a gamepad (Space = cross, Left Shift = square, right mouse = circle, E = triangle,
            W A S D = left stick, mouse = camera, Y = start, Tab = select).

          ### Build it yourself

          The **launcher** (\`twinsanityevolved-launcher-windows-x64.zip\`, \`twinsanityevolved-launcher-macos-arm64.dmg\`) builds
          the game from the source on your own machine instead: it installs the compiler and tools it needs into its own
          app-data folder (about 15 GB) and builds the latest commit. You do not need it to play.

          ### Checksums

          | File | SHA-256 |
          |---|---|
          EOF
          while read -r sha file; do f="${file#\*}"; echo "| ${f#./} | \`$sha\` |" >> release/NOTES.md; done < release/SHA256SUMS
          if [ -n "$missing" ]; then printf '\nNot in this release (the build did not produce it):%s.\n' "$missing" >> release/NOTES.md; fi
          cat release/NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release/NOTES.md
          files: |
            release/*.zip
            release/SHA256SUMS
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
