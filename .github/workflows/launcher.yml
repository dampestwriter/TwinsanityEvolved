# .github/workflows/launcher.yml -- the launcher players download: a portable Windows zip and a macOS .dmg, built by
# tools/ci/release_launcher.ps1 / tools/ci/release_launcher.sh with the official Qt 6 kit.
#
# The launcher carries no game code: on its first run it installs the toolchain, clones the latest commit of this
# repository and builds the game on the player's machine from their own disc image.
#
#   push to main / pull request    build + test + stage both launchers, uploaded as workflow artifacts
#   tag v*                         the same, then a GitHub release with the zip, the dmg and their sha256 files
#   workflow_dispatch              by hand
name: TwinsanityEvolved launcher

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3

jobs:
  windows:
    name: launcher windows-x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `git describe` names the version
      - name: Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: tools/ci/release_launcher.ps1 (build, tests, stage, windeployqt, asset scan, zip)
        shell: pwsh
        run: ./tools/ci/release_launcher.ps1 -Qt "$env:QT_ROOT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: twinsanityevolved-launcher-windows-x64
          path: |
            dist/twinsanityevolved-launcher-windows-x64.zip
            dist/twinsanityevolved-launcher-windows-x64.zip.sha256
          if-no-files-found: error

  macos:
    name: launcher macos-arm64
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TE_MIN_FREE_GB: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ninja
        run: brew install ninja
      - name: Qt ${{ env.QT_VERSION }} (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: tools/ci/release_launcher.sh (build, tests, stage, macdeployqt, codesign, asset scan, dmg)
        run: tools/ci/release_launcher.sh --qt "$QT_ROOT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: twinsanityevolved-launcher-macos-arm64
          path: |
            dist/twinsanityevolved-launcher-macos-arm64.dmg
            dist/twinsanityevolved-launcher-macos-arm64.dmg.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twinsanityevolved-launcher-*
          path: release
          merge-multiple: true
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.txt <<'EOF'
          ## TwinsanityEvolved launcher

          TwinsanityEvolved is a native PC port of **Crash Twinsanity**. This release is the **launcher**: a small app that
          sets everything up, builds the game on your own computer from this repository's source, and starts it.

          **No game data is included.** You need your own copy of the game as a disc image (`.iso`) of the
          **PAL / European disc (SLES-52568)**. The game's files are read from your image at run time and never copied
          anywhere else.

          ### Download

          | Your computer | File |
          |---|---|
          | Windows 10 / 11 (64-bit) | `twinsanityevolved-launcher-windows-x64.zip` |
          | macOS on Apple silicon (M1 or newer) | `twinsanityevolved-launcher-macos-arm64.dmg` |

          ### What the launcher does

          The launcher turns your disc image into a native PC game you keep: once it has built and installed the game you
          start **Crash Twinsanity** from its own shortcut, without the launcher. You only open the launcher again to update.

          1. **Asks where to install the game** (a "Crash Twinsanity" folder, your Desktop by default).
          2. **Installs what the build needs** into its own folder, step by step with a progress list. Anything your
             computer already has is used as it is (Visual Studio, CMake, Ninja, Git, Python); only what is missing is
             downloaded: the game's source (the latest commit of this repository), the pinned game compiler (checked
             against fixed SHA-256 sums), the media libraries (SDL2 and the LGPL FFmpeg movie decoder).
          3. **Finds your disc image** in your Downloads, Desktop and Documents folders (or any folder you add) by what is
             on the disc, not by its file name.
          4. **Builds and installs the game**: the first build takes roughly 10-30 minutes (most of it the one-time
             FFmpeg build). The finished game is copied to the folder you chose, with a **Crash Twinsanity** shortcut on
             your Desktop and in the Start menu (Windows). The game remembers your disc image, so the shortcut just works.
          5. **Settings** is the game's own Options menu in plain language (language, aspect ratio, internal resolution,
             texture filter, frame rate up to 240 / uncapped, vsync, window mode, FPS counter, mods).
          6. **Updates:** when you open the launcher it checks this repository for a newer version and offers to update;
             the update rebuilds and refreshes the installed game. Your saves and settings are kept.

          ### How to use it

          **Windows**
          1. Download `twinsanityevolved-launcher-windows-x64.zip`. Right-click it > *Properties* > tick **Unblock** >
             *OK* (this stops Windows SmartScreen warning about the unsigned launcher), then *Extract All*.
          2. Open the extracted **TwinsanityEvolved** folder and run `TwinsanityEvolved.exe`.
          3. Choose where to install the game.
          4. The first step needs **Visual Studio 2022 Build Tools with the C++ Clang tools**. If they are missing, press
             **Install** on that step (Windows asks for administrator approval; about 5 GB): the launcher shows the
             installer's progress and carries on by itself once they are in place. If Git is missing, the Game source
             step downloads a portable Git for you. If Python 3.8+ is missing, the Python step's **Install** gets it.
          5. Let the first run finish, then press **Build** on the Crash Twinsanity card. When it is done, start the game
             from the **Crash Twinsanity** shortcut (or **Play** in the launcher).

          **macOS**
          1. Open `twinsanityevolved-launcher-macos-arm64.dmg` and drag **TwinsanityEvolved** to Applications.
          2. The first time, right-click the app and choose **Open** (the app is not notarised).
          3. Choose where to install the game.
          4. If the Xcode Command Line Tools are missing, press **Install** on the first step; the launcher carries on
             by itself once macOS has installed them.
          5. Let the first run finish, then **Build**. The game is installed to the folder you chose; start it from there
             or with **Play**.

          ### Requirements

          - About **15 GB** of free disk space for the tools and the build.
          - A graphics driver with **OpenGL 4.1** (any current NVIDIA, AMD, Intel or Apple GPU; not a remote-desktop
            session).
          - Keyboard and mouse, or a DualShock-layout gamepad (Space = cross, Left Shift = square, right mouse = circle,
            E = triangle, W A S D = left stick, mouse = camera, Y = start, Tab = select).

          ### Where things go, and removing it

          - The installed game: the folder you chose (and the Crash Twinsanity shortcuts on Windows).
          - Windows: `%LOCALAPPDATA%\TwinsanityEvolved` (tools, source, builds) and `%USERPROFILE%\.twinsanityevolved`
            (settings and memory cards).
          - macOS: `~/Library/Application Support/TwinsanityEvolved` and `~/.twinsanityevolved`.

          Deleting those folders, the shortcuts and the launcher removes everything. Keep `.twinsanityevolved/memcards` if you want your
          saves.

          ### Checksums

          | File | SHA-256 |
          |---|---|
          EOF
          for f in release/*.sha256; do read -r sha name < "$f"; echo "| ${name} | \`${sha}\` |" >> notes.txt; done
          cat notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.txt
          files: |
            release/*.zip
            release/*.dmg
            release/*.sha256
          fail_on_unmatched_files: true
