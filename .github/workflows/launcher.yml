# .github/workflows/launcher.yml -- the launcher players download: a portable Windows zip and a macOS .dmg, built by
# tools/ci/release_launcher.ps1 / tools/ci/release_launcher.sh with the official Qt 6 kit.
#
# The launcher carries no game code: on its first run it installs the toolchain, clones the latest commit of this
# repository and builds the game on the player's machine from their own disc image.
#
#   push to main / pull request    build + test + stage both launchers, uploaded as workflow artifacts
#   tag v*                         the same, then a GitHub release with the zip, the dmg and their sha256 files
#   workflow_dispatch              by hand
name: TwinsanityEvolved launcher

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3

jobs:
  windows:
    name: launcher windows-x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `git describe` names the version
      - name: Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: tools/ci/release_launcher.ps1 (build, tests, stage, windeployqt, asset scan, zip)
        shell: pwsh
        run: ./tools/ci/release_launcher.ps1 -Qt "$env:QT_ROOT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: twinsanityevolved-launcher-windows-x64
          path: |
            dist/twinsanityevolved-launcher-windows-x64.zip
            dist/twinsanityevolved-launcher-windows-x64.zip.sha256
          if-no-files-found: error

  macos:
    name: launcher macos-arm64
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TE_MIN_FREE_GB: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ninja
        run: brew install ninja
      - name: Qt ${{ env.QT_VERSION }} (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: tools/ci/release_launcher.sh (build, tests, stage, macdeployqt, codesign, asset scan, dmg)
        run: tools/ci/release_launcher.sh --qt "$QT_ROOT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: twinsanityevolved-launcher-macos-arm64
          path: |
            dist/twinsanityevolved-launcher-macos-arm64.dmg
            dist/twinsanityevolved-launcher-macos-arm64.dmg.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twinsanityevolved-launcher-*
          path: release
          merge-multiple: true
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.txt <<'EOF'
          ## TwinsanityEvolved launcher

          TwinsanityEvolved is a native PC port of **Crash Twinsanity**. This release is the **launcher**: a small app that
          sets everything up, builds the game on your own computer from this repository's source, and starts it.

          **No game data is included.** You need your own copy of the game as a disc image (`.iso`) of the
          **PAL / European disc (SLES-52568)**. The game's files are read from your image at run time and never copied
          anywhere else.

          ### Download

          | Your computer | File |
          |---|---|
          | Windows 10 / 11 (64-bit) | `twinsanityevolved-launcher-windows-x64.zip` |
          | macOS on Apple silicon (M1 or newer) | `twinsanityevolved-launcher-macos-arm64.dmg` |

          ### What the launcher does

          1. **First run: installs what the build needs** into its own folder, step by step with a progress list:
             developer tools check, CMake and Ninja, the game's source (the latest commit of this repository), the pinned
             game compiler (checked against fixed SHA-256 sums), the media libraries (SDL2 and the LGPL FFmpeg movie
             decoder) and Python.
          2. **Finds your disc image** in your Downloads, Desktop and Documents folders (or any folder you add) by what is
             on the disc, not by its file name.
          3. **Builds the game** for your computer. The first build takes a while (roughly 15-60 minutes, most of it the
             one-time FFmpeg build); later builds are quick.
          4. **Play** starts the game. The **Settings** page is the game's own Options menu in plain language
             (language, aspect ratio, internal resolution, texture filter, frame rate up to 240 / uncapped, vsync,
             window mode, FPS counter, mods). **Targets** builds the game for another kind of machine.
          5. **Stays up to date:** every time it starts, the launcher checks this repository for a newer version and
             offers to update and rebuild.

          ### How to use it

          **Windows**
          1. Download and unzip `twinsanityevolved-launcher-windows-x64.zip` anywhere, then run `TwinsanityEvolved.exe`
             (Windows SmartScreen may warn about an unrecognised app: *More info* > *Run anyway*).
          2. The first step needs **Visual Studio 2022 Build Tools with the C++ Clang tools**. If they are missing, press
             **Install** on that step (Windows asks for administrator approval; about 5 GB), then **Retry**.
             **Git for Windows** (https://git-scm.com) and **Python 3.8+** (https://python.org, tick "Add to PATH") are
             also needed.
          3. Let the first run finish, then press **Build** on the Crash Twinsanity card, then **Play**.

          **macOS**
          1. Open `twinsanityevolved-launcher-macos-arm64.dmg` and drag **TwinsanityEvolved** to Applications.
          2. The first time, right-click the app and choose **Open** (the app is not notarised).
          3. If the Xcode Command Line Tools are missing, press **Install** on the first step, then **Retry**.
          4. Let the first run finish, then **Build** and **Play**.

          ### Requirements

          - About **15 GB** of free disk space for the tools and the build.
          - A graphics driver with **OpenGL 4.1** (any current NVIDIA, AMD, Intel or Apple GPU; not a remote-desktop
            session).
          - Keyboard and mouse, or a DualShock-layout gamepad (Space = cross, Left Shift = square, right mouse = circle,
            E = triangle, W A S D = left stick, mouse = camera, Y = start, Tab = select).

          ### Where things go, and removing it

          - Windows: `%LOCALAPPDATA%\TwinsanityEvolved` (tools, source, builds) and `%USERPROFILE%\.twinsanityevolved`
            (settings and memory cards).
          - macOS: `~/Library/Application Support/TwinsanityEvolved` and `~/.twinsanityevolved`.

          Deleting those folders and the launcher removes everything. Keep `.twinsanityevolved/memcards` if you want your
          saves.

          ### Checksums

          | File | SHA-256 |
          |---|---|
          EOF
          for f in release/*.sha256; do read -r sha name < "$f"; echo "| ${name} | \`${sha}\` |" >> notes.txt; done
          cat notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.txt
          files: |
            release/*.zip
            release/*.dmg
            release/*.sha256
          fail_on_unmatched_files: true
